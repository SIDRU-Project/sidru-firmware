; SIDRU Smart Bin — firmware ESP32 (Arduino framework, PlatformIO)
; Compilar:  pio run
; Subir:     pio run -t upload
; Monitor:   pio device monitor
;
; Si tu placa es la DevKit V1 de 30 pines y falla la subida, prueba board = esp32doit-devkit-v1.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.11
    ricmoo/QRCode@^0.0.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
